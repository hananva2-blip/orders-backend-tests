name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"  # every night at 02:00 UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - name: Start API + PostgreSQL
        run: docker compose up -d --build --wait
      - name: Functional, database and security tests
        run: pytest
      - name: Load test (20 users, 30s, fails on any error)
        run: locust -f locustfile.py --headless -u 20 -r 10 -t 30s --host http://localhost:8000 --exit-code-on-error 1 --only-summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results
